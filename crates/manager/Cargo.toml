[package]
name = "manager"
version = "2.0.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
owo-colors = "4.4.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_repr = "0.1.21"
solver = { path = "../solver" }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time"] }
